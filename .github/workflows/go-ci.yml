name: Go CI

# Build, vet, fmt-check, and test the module. Versioning and tag pushes
# are out of scope here — they live in `.github/workflows/release.yml`
# behind a conventional-commit gate (see issue #1).

on:
  # This workflow must always create its final `CI` check run. The classifier
  # below decides which expensive gates apply after checkout.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify affected paths
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paths.outputs.go }}
      dogfood: ${{ steps.paths.outputs.dogfood }}
    steps:
      - name: Checkout full event history
        uses: actions/checkout@v6
        with:
          # Classification compares event SHAs locally; it makes no API calls
          # and fails closed if either commit is unexpectedly unavailable.
          fetch-depth: 0
      - name: Classify applicable gates
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/ci-classify-paths.sh

  test:
    name: Build, vet, test
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -eu
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$OUT"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pin to a golangci-lint v2 release built for the module's Go
          # toolchain; the action's default is a v1 build that fails to run
          # against this Go version (the reason this step was previously
          # non-blocking). Blocking again now that the backlog is zero.
          version: v2.13.1

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1 -coverprofile=cover.out -covermode=atomic

      - name: coverage gate (100%)
        run: ./scripts/coverage-gate.sh

  windows-event-process-tree:
    name: Windows event process-tree lifecycle
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # This is deliberately a runtime test, not a Windows cross-compile. It
      # proves both job-owned timeout cleanup and that normal success preserves
      # a background descendant after the Job Object handle is released.
      - name: Test Windows Job Object lifecycle
        run: go test ./pkg/event -run '^TestExec(WindowsResumeLookupFailurePreventsStart|WindowsAssignmentFailureTerminatesSuspendedProcess|WindowsResumeFailureTerminatesOwnedProcess|WindowsJobTerminationFailureFallsBackDuringDeliver|ConfigureErrorAfterDeadlineReturnsTimeoutError|DeadlineBeforeStartReturnsTimeoutError|StdinPipeErrorAfterDeadlineReturnsTimeoutError|StdinPipeSuccessAfterDeadlineReturnsTimeoutError|StartErrorAfterDeadlineReturnsTimeoutError|AfterStartSuccessAfterDeadlineReturnsTimeoutError|CancellationTerminatesHungProcessTree|SuccessfulCommandLeavesBackgroundProcessRunning)$' -count=3 -timeout=60s

  release-targets:
    name: Build advertised release targets
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # GoReleaser reads the OS/architecture matrix directly from
      # .goreleaser.yml, keeping this gate aligned with published artifacts.
      - name: Build GoReleaser target matrix
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean

  # Runs the committed acceptance corpus (Studio + Rehearse scenarios) through
  # the self-hosted `rehearse run` runner. A separate job so Go test timing is
  # unaffected (REQ: studio-corpus-green of spec/features/cli/rehearse/run).
  rehearse-corpus:
    name: Rehearse corpus
    needs: classify
    if: ${{ needs.classify.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build -o /tmp/specscore ./cmd/specscore

      # hurl is not in the Ubuntu apt archive; install the pinned release .deb
      # from GitHub (hurl-block scenarios execute HTTP steps through it).
      - name: Install hurl
        run: |
          set -eu
          HURL_VERSION=8.0.1
          curl -fsSL --retry 3 -o /tmp/hurl.deb \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get install -y /tmp/hurl.deb
          hurl --version

      - name: Run acceptance corpus
        env:
          # The scenarios invoke the CLI under test via $SPECSCORE (they
          # default to `specscore` on PATH otherwise).
          SPECSCORE: /tmp/specscore
          # Self-hosting gate scenario uses $REPO_ROOT to locate the checkout.
          REPO_ROOT: ${{ github.workspace }}
        run: >
          /tmp/specscore rehearse run
          spec/features/cli/studio/index/_tests
          spec/features/cli/studio/probe/_tests
          spec/features/cli/studio/answers/_tests
          spec/features/cli/rehearse/run/_tests
          spec/features/cli/rehearse/evidence/_tests
          spec/features/cli/rehearse/new/_tests
          spec/features/cli/rehearse/new-dry-run/_tests
          spec/features/cli/rehearse/reusable-checks/_tests
          spec/features/cli/rehearse/thin-acs/_tests
          spec/features/cli/rehearse/nested-suites/_tests
          spec/features/cli/rehearse/run-filter/_tests
          spec/features/cli/rehearse/file-assertions/_tests
          spec/features/cli/rehearse/file-assertions-glob/_tests
          spec/features/cli/rehearse/file-assertions-glob-recursive/_tests
          spec/features/cli/rehearse/file-assertions-glob-braces/_tests
          --report-out .specscore/rehearse/latest.json
          --format json

      # The answers benchmark exit gate (cli/studio/answers#req:exit-gate-fixture-and-sneat):
      # the hermetic fixture floor. Indexes + seeds the committed fixture and
      # asserts every answerable instance answers and every expected-unanswerable
      # declines (no network, no gh — sqlite3-seeded probe facts).
      - name: answers benchmark fixture floor
        env:
          SPECSCORE: /tmp/specscore
        run: spec/features/cli/studio/answers/benchmark/run.sh --fixture

      - name: v0.4 self-hosting gate (studio index + facts --class verified-behavior)
        env:
          SPECSCORE: /tmp/specscore
        run: |
          set -euo pipefail
          # Write a minimal workspace referencing this repo checkout.
          printf 'name: specscore-cli-gate\nrepos:\n  - %s\n' \
            "${{ github.workspace }}" > /tmp/gate-studio.yaml
          # Index the workspace; the rehearse adapter reads the report written above.
          /tmp/specscore studio index --workspace /tmp/gate-studio.yaml
          # Assert facts --class verified-behavior returns rows for cli/studio/index ACs.
          json="$(/tmp/specscore studio facts \
            --db /tmp/.specscore-studio/facts.db \
            --class verified-behavior --format json)"
          # Use a here-string, not `echo "$json" | grep -q`: under pipefail,
          # grep -q closes the pipe on first match, echo gets SIGPIPE, and the
          # pipeline is reported as failed even though the pattern matched — a
          # size-dependent false failure once the JSON is large.
          grep -q 'cli/studio/index#ac:' <<< "$json" \
            || { echo "GATE FAIL: no cli/studio/index#ac: subject in verified-behavior facts"; echo "$json"; exit 1; }

  dogfood:
    name: Dogfood lint
    needs: classify
    if: ${{ needs.classify.outputs.dogfood == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        run: go build -o /tmp/specscore ./cmd/specscore
      - name: Lint own spec tree
        run: /tmp/specscore spec lint
      - name: Check lint-rule catalog is in sync
        run: /tmp/specscore rules --check

  ci:
    # This exact job name is the one stable GitHub Actions check context that
    # branch protection may require. Do not rename it without changing the
    # protected ruleset at the same time.
    name: CI
    needs: [classify, test, windows-event-process-tree, release-targets, rehearse-corpus, dogfood]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Require every applicable gate to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          GO_APPLICABLE: ${{ needs.classify.outputs.go }}
          DOGFOOD_APPLICABLE: ${{ needs.classify.outputs.dogfood }}
          TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_RESULT: ${{ needs.windows-event-process-tree.result }}
          RELEASE_TARGETS_RESULT: ${{ needs.release-targets.result }}
          REHEARSE_CORPUS_RESULT: ${{ needs.rehearse-corpus.result }}
          DOGFOOD_RESULT: ${{ needs.dogfood.result }}
        run: ./scripts/ci-aggregate.sh
