name: Validate published SpecScore CLI artifact

# This is intentionally validation-only: it re-executes the published archive
# smoke checks for one existing release tag without creating a tag or release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact SpecScore CLI release tag to validate (for example, v0.33.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-published-artifact-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    uses: strongo/cicd/.github/workflows/validate-published-artifact.yml@v1
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_binary: specscore
      artifact_command: --version
