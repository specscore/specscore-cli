name: Release

# Releases are cut by pushing a vX.Y.Z tag — the explicit, human-gated action
# that has always been this repo's primary path ("push a tag to release"):
#
#   git tag v0.20.0 && git push origin v0.20.0
#
# The shared strongo/cicd release workflow then runs GoReleaser against this
# repo's own .goreleaser.yml. Because we trigger on a tag (github.ref_type ==
# 'tag'), the shared workflow SKIPS its auto-bump step and releases the exact
# tag pushed — no version is ever chosen automatically (important on 0.x, where
# a `feat!:` must never silently jump to 1.0.0).
#
# NOTE: this replaces the previous local composite action (.github/actions/
# release) whose workflow_dispatch path offered svu bump-selection
# (patch/minor/major) and a snapshot-only fallback build. Those conveniences on
# the dispatch path are dropped in favour of sharing the org release core; the
# version is now always the tag you push. Release-build validation on PRs, if
# wanted, belongs in go-ci.yml rather than here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: strongo/cicd/.github/workflows/release.yml@v1
    permissions:
      contents: write
    secrets:
      # Cross-repo PAT (classic, public_repo) for the Homebrew tap, Scoop
      # bucket, and WinGet fork. Forwarded to GoReleaser as
      # $GORELEASER_GITHUB_TOKEN and referenced by .goreleaser.yml.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.SPECSCORE_GORELEASER_GITHUB_TOKEN }}
