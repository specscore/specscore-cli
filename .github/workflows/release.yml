name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run. Pushing an explicit `vX.Y.Z` tag also works and
# releases that exact version (the shared workflow skips the bump on a tag ref).
# A docs/chore-only merge cuts no tag and publishes nothing.
#
# specscore is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is CAPPED to a minor bump (0.x -> 0.(x+1)) by the shared workflow's
# guard instead of jumping to v1.0.0. Cut v1.0.0 deliberately by pushing that
# tag.
#
# NOTE: this replaces the previous local composite action (.github/actions/
# release) whose workflow_dispatch path offered svu bump-selection
# (patch/minor/major) and a snapshot-only fallback build. Those conveniences are
# dropped in favour of sharing the org release core. Release-build validation on
# PRs, if wanted, belongs in go-ci.yml rather than here.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifact-smoke-darwin-arm64:
    name: Run darwin/arm64 release artifact
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the release artifact
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean --single-target

      - name: Smoke-test the packaged executable
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import subprocess

          artifacts = json.loads(pathlib.Path("dist/artifacts.json").read_text())
          binaries = [
              artifact["path"]
              for artifact in artifacts
              if artifact.get("type") == "Binary"
              and artifact.get("name") == "specscore"
              and artifact.get("goos") == "darwin"
              and artifact.get("goarch") == "arm64"
          ]
          if len(binaries) != 1:
              raise SystemExit(
                  f"expected one darwin/arm64 specscore binary, found {binaries}"
              )

          commands = (
              (binaries[0], "--version"),
              (binaries[0], "spec", "lint", "--no-telemetry"),
          )
          for command in commands:
              try:
                  completed = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=10,
                      check=False,
                  )
              except subprocess.TimeoutExpired as error:
                  raise SystemExit(f"release artifact timed out: {command}") from error
              if completed.returncode != 0:
                  raise SystemExit(
                      f"release artifact failed ({completed.returncode}): {command}\n"
                      f"stdout:\n{completed.stdout}\nstderr:\n{completed.stderr}"
                  )
              if command[-1] == "--version" and not completed.stdout.strip():
                  raise SystemExit("release artifact --version produced no output")
          PY

  release:
    needs: release-artifact-smoke-darwin-arm64
    # Pinned to the exact strongo/cicd@v1.14.14 tag, not the moving
    # strongo/cicd@v1 major tag. strongo/cicd@v1 accepts the
    # require_notarized_macos input but does not contain the
    # macos_signing_preflight job behind it, so on that tag the flag is a
    # silent no-op; strongo/cicd@v1.14.14 has both, and defines all three
    # `with:` inputs this workflow passes (go_version,
    # allow_major_version_bump, artifact_smoke_test_homebrew_cask). The
    # sibling repos in this ecosystem (ingitdb-cli, chatwright/cli,
    # datatug-cli) are now pinned to strongo/cicd@v1.14.14 too.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.17
    permissions:
      contents: write
    with:
      # strongo/cicd's go_version input defaults to '1.26' and drives the
      # setup-go step the shared release job's `go mod tidy`/`go generate`
      # before-hooks run under — those hooks execute ahead of GoReleaser's
      # own build matrix and do not see .goreleaser.yml's builds[0].env
      # GOTOOLCHAIN pin. Pin it to match go.mod's `go 1.27.0` directive so
      # those hooks don't fail with "go.mod requires go >= 1.27.0" before
      # the release build ever starts.
      go_version: '1.27.0'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump. Cut v1.0.0
      # only by pushing that tag explicitly.
      allow_major_version_bump: false
      # specscore: cli/release-distribution#req:fail-closed-macos-release-gate
      # The operator has confirmed all five named Apple secrets below exist,
      # with fresh update timestamps, in every org secret store that needs
      # them — the confirmation this gate was waiting for. Flip it fail-
      # closed: an absent, invalid, improperly signed, or unnotarized
      # published Darwin artifact now fails the release outright.
      require_notarized_macos: true
      # specscore: cli/release-distribution#req:block-homebrew-cask-until-verified
      # Verified end to end against a real published artifact:
      # ingitdb/ingitdb-cli v0.65.11 (toolchain go1.27.0) satisfies its
      # Designated Requirement (`certificate 1[...6.2.6]`, not the broken
      # `certificate root[...6.2.6]`), `spctl` accepts it as Notarized
      # Developer ID, and it executes; that release's own "Smoke test
      # Homebrew cask install (darwin/arm64)" job passed. With the
      # notarization gate above now fail-closed, collect the same
      # cask-install evidence here.
      artifact_smoke_test_homebrew_cask: true
    secrets:
      # Cross-repo PAT (classic, public_repo) for the Homebrew tap, Scoop
      # bucket, and WinGet fork. Forwarded to GoReleaser as
      # $GORELEASER_GITHUB_TOKEN and referenced by .goreleaser.yml.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.SPECSCORE_GORELEASER_GITHUB_TOKEN }}
      # specscore: cli/release-distribution#req:release-secret-forwarding
      # GoReleaser consumes these only through its notarize.macos block. Do
      # not print, transform, or otherwise persist any value in this workflow.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}