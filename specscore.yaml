# SpecScore Repo Config Schema: https://specscore.md/repo-config

project:
  title: SpecScore CLI
  host: github.com
  org: specscore
  repo: specscore-cli

# Reviewer gates consumed by specstudio skills. The specify gate must release
# (every entry Approved) before a Feature can move to writing-plans.
gates:
  specify:
    reviewers:
      - name: human-approval
        type: human
  implementation:
    # Batches commit autonomously; the single human checkpoint is the push gate.
    pre_commit:
      reviewers:
        - name: auto-approve
          type: noop   # noop is the schema's auto-approve type: dispatches nothing, always Approved
          description: Auto-approve batch commits without review; the push gate is the human checkpoint.
    pre_push:
      reviewers:
        - name: human-approval
          type: human

