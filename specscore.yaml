# SpecScore Repo Config Schema: https://specscore.md/repo-config

project:
  title: SpecScore CLI
  host: github.com
  org: specscore
  repo: specscore-cli

# Reviewer gates consumed by specstudio skills. The specify gate must release
# (every entry Approved) before a Feature can move to writing-plans.
gates:
  specify:
    reviewers:
      - name: human-approval
        type: human
  implementation:
    # Batches commit autonomously; the single human checkpoint is the push gate.
    pre_commit:
      reviewers:
        - type: auto-approve   # dispatches nothing, always Approved (name defaults to type)
          description: Auto-approve batch commits without review; the push gate is the human checkpoint.
    pre_push:
      reviewers:
        - name: human-approval
          type: human
  # Verify gate for specstudio:pull-request — runs BEFORE a PR is created, so a
  # branch below the 100% coverage gate never reaches an open PR (the failure
  # mode behind PR #48). pull-request-gate.sh is the PR-specific verify command;
  # it delegates to scripts/coverage-gate.sh — the single source of truth for
  # coverage that CI and the pre-push hook also enforce. The deterministic
  # reviewer's verdict is the script's exit code (0 -> Approved; non-zero ->
  # Issues Found, PR creation blocked). Human approval follows.
  pull_request:
    pre_dispatch:
      reviewers:
        - name: verify
          type: deterministic
          run: ./scripts/pull-request-gate.sh
        - name: human-approval
          type: human

